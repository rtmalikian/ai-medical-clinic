[project]
name = "ai-medical-clinic"
version = "0.1.0"
description = "AI Medical Clinic: modular agentic healthcare administration workflows with FHIR/EHR and OpenAI-compatible API integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Raphael T. Malikian", email = "rtmalikian@gmail.com" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "orjson>=3.10"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
